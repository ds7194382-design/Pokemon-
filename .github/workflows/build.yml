name: Build Pocket
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/build.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create project
        run: |
          mkdir -p app/src/main/java/com/pocket/assistant
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Pocket"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          echo "org.gradle.jvmargs=-Xmx2g" > gradle.properties
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.pocket.assistant"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.pocket.assistant"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <queries>
                  <intent><action android:name="android.speech.RecognitionService"/></intent>
              </queries>
              <application android:label="Pocket" android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/pocket/assistant/MainActivity.kt <<'EOF'
          package com.pocket.assistant

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.Locale
          import kotlin.concurrent.thread

          class MainActivity : Activity(), TextToSpeech.OnInitListener {
              private lateinit var tts: TextToSpeech
              private lateinit var status: TextView
              private lateinit var keyBox: EditText
              private var rec: SpeechRecognizer? = null
              private val history = JSONArray()

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  tts = TextToSpeech(this, this)
                  val prefs = getSharedPreferences("pocket", MODE_PRIVATE)
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(48, 96, 48, 48)
                  keyBox = EditText(this)
                  keyBox.hint = "Anthropic API key"
                  keyBox.setText(prefs.getString("key", ""))
                  val save = Button(this)
                  save.text = "Save key"
                  save.setOnClickListener {
                      prefs.edit().putString("key", keyBox.text.toString().trim()).apply()
                      status.text = "Key save ho gayi"
                  }
                  val talk = Button(this)
                  talk.text = "Talk to Pocket"
                  talk.setOnClickListener { listen() }
                  status = TextView(this)
                  status.textSize = 18f
                  status.text = "Key daalo, Save dabao, phir Talk dabao."
                  val scroll = ScrollView(this)
                  scroll.addView(status)
                  root.addView(keyBox)
                  root.addView(save)
                  root.addView(talk)
                  root.addView(scroll)
                  setContentView(root)
              }

              override fun onInit(s: Int) {
                  tts.language = Locale("hi", "IN")
              }

              private fun listen() {
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), 1)
                      return
                  }
                  rec?.destroy()
                  rec = SpeechRecognizer.createSpeechRecognizer(this)
                  rec?.setRecognitionListener(object : RecognitionListener {
                      override fun onResults(r: Bundle?) {
                          val t = r?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()
                          if (t != null) ask(t)
                      }
                      override fun onError(e: Int) { status.text = "Sun nahi paya, dobara try karo (error " + e + ")" }
                      override fun onReadyForSpeech(p: Bundle?) { status.text = "Boliye..." }
                      override fun onBeginningOfSpeech() {}
                      override fun onRmsChanged(v: Float) {}
                      override fun onBufferReceived(b: ByteArray?) {}
                      override fun onEndOfSpeech() {}
                      override fun onPartialResults(p: Bundle?) {}
                      override fun onEvent(t: Int, p: Bundle?) {}
                  })
                  val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "hi-IN")
                  rec?.startListening(i)
              }

              private fun ask(q: String) {
                  status.text = "Aap: " + q + "\n\nSoch raha hoon..."
                  val key = getSharedPreferences("pocket", MODE_PRIVATE).getString("key", "") ?: ""
                  history.put(JSONObject().put("role", "user").put("content", q))
                  thread {
                      var reply: String
                      try {
                          val c = URL("https://api.anthropic.com/v1/messages").openConnection() as HttpURLConnection
                          c.requestMethod = "POST"
                          c.doOutput = true
                          c.setRequestProperty("x-api-key", key)
                          c.setRequestProperty("anthropic-version", "2023-06-01")
                          c.setRequestProperty("content-type", "application/json")
                          val body = JSONObject()
                              .put("model", "claude-sonnet-5-5")
                              .put("max_tokens", 300)
                              .put("system", "You are Pocket, a voice assistant. Reply in the language the user speaks (Hindi, Hinglish or English). Keep replies to 1-3 short sentences, plain text only.")
                              .put("messages", history)
                          c.outputStream.use { it.write(body.toString().toByteArray()) }
                          val ok = c.responseCode in 200..299
                          val text = (if (ok) c.inputStream else c.errorStream).bufferedReader().readText()
                          if (ok) {
                              reply = JSONObject(text).getJSONArray("content").getJSONObject(0).getString("text")
                              history.put(JSONObject().put("role", "assistant").put("content", reply))
                              while (history.length() > 10) { history.remove(0); history.remove(0) }
                          } else {
                              history.remove(history.length() - 1)
                              reply = "Error " + c.responseCode + ": " + text
                          }
                      } catch (e: Exception) {
                          history.remove(history.length() - 1)
                          reply = "Error: " + e.message
                      }
                      runOnUiThread {
                          status.text = "Aap: " + q + "\n\nPocket: " + reply
                          tts.speak(reply, TextToSpeech.QUEUE_FLUSH, null, "pocket")
                      }
                  }
              }
          }
          EOF
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Pocket-APK
          path: app/build/outputs/apk/debug/app-debug.apk
